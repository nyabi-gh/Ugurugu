[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = false

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained, not a vulnerability: a derive macro Velopack uses at
    # build time, with no code in the app.
    { id = "RUSTSEC-2024-0388", reason = "build-time derive macro of velopack" },
    # zip 8.6.0, which only Velopack 1.2.161 still pulls in, fixed in 9: all
    # four are in ZipArchive::extract and ZipStreamReader::extract, which
    # Velopack does not call (it copies entries from by_index). Its zip 9
    # change has no stable release yet (backlog B3-145).
    { id = "RUSTSEC-2026-0367", reason = "zip extract(), not called; velopack 1.2.161 needs zip 8" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract(), not called; velopack 1.2.161 needs zip 8" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract(), not called; velopack 1.2.161 needs zip 8" },
    { id = "RUSTSEC-2026-0429", reason = "zip extract(), not called; velopack 1.2.161 needs zip 8" },
    # Unmaintained, not vulnerabilities, and Linux only. zvariant, zbus_names
    # and zvariant_derive became part of zbus 6; AccessKit (accesskit_unix
    # 0.21.1, which egui-winit 0.36.2 fixes) needs zbus 5, so moving our own
    # zbus calls to 6 would add a second zbus and remove none of the three.
    { id = "RUSTSEC-2026-0370", reason = "part of zbus 5, which accesskit_unix 0.21.1 needs" },
    { id = "RUSTSEC-2026-0371", reason = "part of zbus 5, which accesskit_unix 0.21.1 needs" },
    { id = "RUSTSEC-2026-0372", reason = "part of zbus 5, which accesskit_unix 0.21.1 needs" },
    # ttf-parser draws the title of the window frame winit makes where the
    # compositor has none (GNOME), through sctk-adwaita 0.10.1. winit's
    # other choices are a frame without a title or FreeType (backlog B3-185).
    { id = "RUSTSEC-2026-0192", reason = "title text of winit's Wayland frame, through sctk-adwaita" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# Mozilla's root certificates, which the update check's TLS (Velopack ->
# ureq -> rustls) trusts. A permissive data licence; its text goes into the
# third-party notices (docs/rust/decisions.md M6-5).
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are path dependencies and are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
