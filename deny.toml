[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained, not a vulnerability: a derive macro Velopack uses at
    # build time, with no code in the app.
    { id = "RUSTSEC-2024-0388", reason = "build-time derive macro of velopack" },
    # zip 8.6.0, which only Velopack 1.2.161 still pulls in, fixed in 9: all
    # three are in ZipArchive::extract and ZipStreamReader::extract, which
    # Velopack does not call (it copies entries from by_index). Its zip 9
    # change has no stable release yet (backlog B3-145).
    { id = "RUSTSEC-2026-0367", reason = "zip extract(), not called; velopack 1.2.161 needs zip 8" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract(), not called; velopack 1.2.161 needs zip 8" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract(), not called; velopack 1.2.161 needs zip 8" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# Mozilla's root certificates, which the update check's TLS (Velopack ->
# ureq -> rustls) trusts. A permissive data licence; its text goes into the
# third-party notices (docs/rust/decisions.md M6-5).
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are path dependencies and are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
