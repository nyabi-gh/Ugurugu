name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A pull request's new push cancels its older run. Each push to main has a
# group of its own and runs to the end: a release requires the main CI of
# its tagged commit, and in a shared group a third push would still cancel
# the run waiting behind the first.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs only the jobs the changes can affect: a pull request against its base,
  # a push to main against the newest main commit whose CI succeeded, so a
  # cancelled or failed run's changes are checked again. Releases rely on this.
  # Paths no rule recognises, and pushes without such a commit, run everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Classify the changed paths
        id: detect
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          rust=false
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            BASE=
            passed=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch="$GITHUB_REF_NAME" -f event=push -f status=success \
              -f per_page=100 --jq '.workflow_runs[].head_sha') || passed=
            for sha in $passed; do
              if [[ "$sha" != "$GITHUB_SHA" ]] &&
                  git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then
                BASE=$sha
                break
              fi
            done
            echo "Last successful CI on $GITHUB_REF_NAME: ${BASE:-none}"
          fi
          if [[ -z "$BASE" ]]; then
            rust=true
          else
            while IFS= read -r path; do
              case "$path" in
                docs/*|release-notes/*|README*.md|CONTRIBUTING.md|SECURITY.md|BUILDING.md|CLAUDE.md|tools/sandbox/*|tools/check_docs.py) ;;
                apps/*|crates/*|tools/latency-probe/*|tools/render-bench/*|tools/ugu-doc/*|tools/ime_probe.py|tools/baseline_probe.py|tools/display_scale.py|tools/uia_probe.ps1|tools/native_deps.py|tools/package_*.ps1|tools/third_party_notices.py|Cargo.toml|Cargo.lock|rust-toolchain.toml|deny.toml|about.toml|.cargo/*)
                  rust=true ;;
                # Everything else may reach the app or its checks.
                *)
                  rust=true ;;
              esac
            done < <(git diff --name-only "$BASE" HEAD)
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "rust=$rust"

  static:
    name: Sources and release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check license headers
        shell: bash
        run: |
          identifier='SPDX-License-Identifier: GPL-3.0-or-later'
          missing=()
          while IFS= read -r file; do
            if ! head -n 3 "$file" | grep -qF "$identifier"; then
              missing+=("$file")
            fi
          done < <(git ls-files -- '*.js' '*.ps1' '*.py' '*.rs' '*.sh')
          if [[ ${#missing[@]} -ne 0 ]]; then
            echo "Sources missing the '$identifier' header:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Check document links and backlog IDs
        run: python3 -X utf8 tools/check_docs.py

      - name: Check the Fluent files against strings.txt
        shell: bash
        run: |
          python3 -X utf8 tools/strings_to_ftl.py
          if [[ -n "$(git status --porcelain -- apps/ugurugu/i18n)" ]]; then
            git status --short -- apps/ugurugu/i18n
            git diff -- apps/ugurugu/i18n
            echo "The .ftl files are not what strings.txt makes; run python -X utf8 tools/strings_to_ftl.py"
            exit 1
          fi

      - name: Test download badge aggregation
        run: node --test .github/scripts/update-download-badge.test.js

      # The same checks release-3.yml makes on a tag, found before tagging.
      - name: Check release metadata
        shell: bash
        run: |
          version=$(sed -nE '/^\[workspace\.package\]/,/^\[/ s/^version = "([^"]+)"/\1/p' Cargo.toml)
          if [[ ! "$version" =~ ^3\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid 3.x workspace version: $version"
            exit 1
          fi
          notes="release-notes/$version.en.md"
          if [[ ! -s "$notes" ]] || ! grep -q '[^[:space:]]' "$notes"; then
            echo "Missing or empty release notes: $notes"
            exit 1
          fi

  rust-static:
    name: Format and dependencies
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-deny@0.18.9

      - name: Format
        run: cargo fmt --all --check

      # Advisories are checked weekly and before a release (advisories.yml,
      # release-3.yml), so one published today fails no unrelated change.
      - name: Dependencies
        run: cargo deny --locked check bans licenses sources

  test:
    name: Rust Windows tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # A failing test's backtrace keeps its files and lines, without the
      # full debug information to build, link and cache.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      # Only main saves: a pull request's cache serves that pull request
      # alone, and saving one took minutes.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  release-test:
    name: Rust Windows release tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Some faults show only in the optimised build.
      - name: Test optimised
        run: cargo test --workspace --release --locked

  # The executable, package and checks of release-3.yml, so a release does
  # not find a build or packaging problem first.
  package:
    name: Windows package
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-about@0.9.2

      - name: Install Velopack
        run: dotnet tool install --global vpk --version 1.2.161

      - name: Native dependencies
        run: python tools/native_deps.py

      - name: Release build
        run: cargo build --package ugurugu --release --locked

      - name: Package
        shell: pwsh
        run: ./tools/package_windows.ps1 -Executable target/release/ugurugu.exe -OutputDirectory "$env:RUNNER_TEMP/package"

      - name: Install, run and uninstall
        shell: pwsh
        run: ./tools/package_smoke.ps1 -Setup (Get-Item "$env:RUNNER_TEMP/package/*-Setup.exe").FullName -WorkDirectory "$env:RUNNER_TEMP/smoke"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ugurugu-rust-windows-x64
          path: target/release/ugurugu.exe
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Quality gate
    if: always()
    needs: [changes, static, rust-static, test, release-test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality check that ran
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          RUST_STATIC_RESULT: ${{ needs.rust-static.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RELEASE_TEST_RESULT: ${{ needs.release-test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          failed=0
          # A check may be skipped only because its paths did not change,
          # which needs change detection itself to have succeeded.
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "CHANGES result: $CHANGES_RESULT"
            failed=1
          fi
          for check in STATIC RUST_STATIC TEST RELEASE_TEST PACKAGE; do
            result_variable="${check}_RESULT"
            result="${!result_variable}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "$check result: $result"
              failed=1
            fi
          done
          exit "$failed"
