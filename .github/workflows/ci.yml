name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.11.1
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
  QT_FORCE_STDERR_LOGGING: 1

jobs:
  static:
    name: Format and release metadata
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check source formatting
        run: >-
          git ls-files -z -- '*.cpp' '*.hpp' '*.mm' |
          xargs -0 xcrun clang-format --dry-run --Werror

      - name: Check license headers
        shell: bash
        run: |
          identifier='SPDX-License-Identifier: GPL-3.0-or-later'
          missing=()
          while IFS= read -r file; do
            if ! head -n 3 "$file" | grep -qF "$identifier"; then
              missing+=("$file")
            fi
          done < <(git ls-files -- '*.cpp' '*.hpp' '*.mm' '*.vert' '*.frag' '*.js')
          if [[ ${#missing[@]} -ne 0 ]]; then
            echo "Sources missing the '$identifier' header:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Test download badge aggregation
        run: node --test .github/scripts/update-download-badge.test.js

      - name: Check release metadata
        shell: bash
        run: |
          version=$(sed -nE 's/project\(Ugurugu VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid project version: $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi
          for language in ko en ja; do
            notes="release-notes/$version.$language.md"
            if [[ ! -s "$notes" ]] || ! grep -q '[^[:space:]]' "$notes"; then
              echo "Missing or empty release notes: $notes"
              exit 1
            fi
          done
          shopt -s nullglob
          notes=(release-notes/"$version".*.md)
          if [[ ${#notes[@]} -ne 3 ]]; then
            echo "Expected exactly ko, en, and ja release notes for version $version"
            printf 'Found: %s\n' "${notes[@]}"
            exit 1
          fi

  translations:
    name: Translations
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '${{ env.QT_VERSION }}'
          aqtsource: '${{ env.AQT_SOURCE }}'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Check translation completeness
        run: |
          translation_dir="$RUNNER_TEMP/translations"
          mkdir -p "$translation_dir"
          cp i18n/ugurugu_ko.ts i18n/ugurugu_ja.ts "$translation_dir/"
          "$QT_ROOT_DIR/bin/lupdate" \
            src \
            -extensions cpp,hpp,mm \
            -no-obsolete \
            -warnings-are-errors \
            -ts \
            "$translation_dir/ugurugu_ko.ts" \
            "$translation_dir/ugurugu_ja.ts"
          if grep -n 'type="unfinished"' "$translation_dir"/*.ts; then
            echo "Translations contain unfinished entries"
            exit 1
          fi

  web:
    name: Web shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      # The wasm engine comes from the wasm-release preset, which this job does
      # not build, so this covers the shell's bundling only.
      - name: Build shell
        run: npm run build

      - name: Check the itch.io package rules
        run: node ../tools/check_itchio_package.mjs dist

  wasm:
    name: Wasm engine parity
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      # The desktop kit builds the native probe and, as QT_HOST_PATH, supplies
      # moc and rcc for the cross build.
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '${{ env.QT_VERSION }}'
          aqtsource: '${{ env.AQT_SOURCE }}'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtshadertools
          cache: true

      # Qt ships wasm as a single Windows-built archive; only qtbase exists for
      # it, which is all the engine subset needs. The preset resolves the
      # toolchain file under ~/Qt, so it has to land there.
      - name: Install the Qt wasm kit
        run: |
          python3 -m pip install --break-system-packages "$AQT_SOURCE"
          python3 -m aqt install-qt all_os wasm "$QT_VERSION" \
            wasm_singlethread --outputdir "$HOME/Qt"

      # Pinned by Qt 6.11.1: the ABI has to match exactly.
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git \
            "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 4.0.7
          "$HOME/emsdk/emsdk" activate 4.0.7

      - name: Build the wasm engine
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          cmake --preset wasm-release -DQT_HOST_PATH="$QT_ROOT_DIR"
          cmake --build --preset wasm-release --parallel

      - name: Smoke the wasm engine
        run: node tools/wasm_engine_smoke.mjs examples/Wave.ugu |
          tee "$RUNNER_TEMP/wasm.txt"

      - name: Verify wasm content editing
        run: node tools/wasm_content_smoke.mjs

      - name: Build the native probe
        run: |
          cmake --preset macos-debug
          cmake --build --preset macos-debug \
            --target ugurugu_engine_digest_probe --parallel

      - name: Compare native and wasm digests
        run: |
          ./out/build/macos-debug/ugurugu_engine_digest_probe \
            examples/Wave.ugu > "$RUNNER_TEMP/native.txt"
          cat "$RUNNER_TEMP/native.txt"
          # The smoke script prints the same lines plus a header and a verdict,
          # so every probe line has to appear verbatim in its output.
          while IFS= read -r line; do
            if ! grep -qxF "$line" "$RUNNER_TEMP/wasm.txt"; then
              echo "native line missing from the wasm run: $line"
              exit 1
            fi
          done < "$RUNNER_TEMP/native.txt"

      # The shell's browser suite covers what neither the smoke nor the digest
      # comparison can — drawing, recovery, export, selection, the presenter's
      # fallbacks — and it needs a real engine, which only this job builds. The
      # Web shell job deliberately runs without one.
      - name: Install the web shell dependencies
        working-directory: web
        run: npm ci

      - name: Bundle the shell against the engine built above
        working-directory: web
        run: npm run build

      # playwright-core never downloads a browser, so the matching CLI does.
      - name: Install Chromium
        run: npx --yes playwright@1.62.1 install chromium

      - name: Verify the web shell in a browser
        working-directory: web
        run: npm run test:browser

  fuzz:
    name: Fuzz parsers
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '${{ env.QT_VERSION }}'
          aqtsource: '${{ env.AQT_SOURCE }}'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtshadertools
          cache: true

      # Xcode's clang ships no libclang_rt.fuzzer_osx.a, so -fsanitize=fuzzer
      # cannot link against it. macOS 15's linker also rejects the sanitizer
      # relocations from current LLVM: https://github.com/llvm/llvm-project/issues/139684
      - name: Install LLVM 22 and LLD
        run: |
          brew install llvm@22 lld@22
          echo "$(brew --prefix lld@22)/bin" >> "$GITHUB_PATH"

      # Deliberately without UGURUGU_WARNINGS_AS_ERRORS: the build jobs already
      # gate warnings on the toolchains releases ship with, and a Homebrew LLVM
      # bump should not be able to fail this job over a new diagnostic.
      - name: Configure
        run: |
          llvm_prefix="$(brew --prefix llvm@22)"
          cmake --preset macos-fuzzing \
            -DCMAKE_C_COMPILER="$llvm_prefix/bin/clang" \
            -DCMAKE_CXX_COMPILER="$llvm_prefix/bin/clang++" \
            -DCMAKE_LINKER_TYPE=LLD

      - name: Build
        run: cmake --build --preset macos-fuzzing --parallel

      # Qt's process-lifetime caches are indistinguishable from leaks here, so
      # only the memory-safety and undefined-behaviour checks gate the build.
      # libFuzzer prints a crashing input as base64, so no artifact upload is
      # needed to reproduce a failure.
      - name: Fuzz
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          build=out/build/macos-fuzzing
          fuzzed=0
          for target in "$build"/ugurugu_fuzz_*; do
            if [[ ! -f "$target" ]]; then
              continue
            fi
            fuzzed=$((fuzzed + 1))
            name=$(basename "$target")
            echo "::group::$name"
            "$target" \
              "$build/fuzz-corpus/$name" \
              -max_total_time=90 \
              -max_len=65536 \
              -timeout=25 \
              -rss_limit_mb=4096 \
              -print_final_stats=1
            echo "::endgroup::"
          done
          if [[ "$fuzzed" -eq 0 ]]; then
            echo "No fuzz targets were built"
            exit 1
          fi

  tidy:
    name: Clang-Tidy
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '${{ env.QT_VERSION }}'
          aqtsource: '${{ env.AQT_SOURCE }}'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtshadertools
          cache: true

      - name: Install LLVM 22
        run: brew install llvm@22

      - name: Configure
        run: |
          llvm_prefix="$(brew --prefix llvm@22)"
          cmake --preset macos-debug \
            -DUGURUGU_WARNINGS_AS_ERRORS=ON \
            -DUGURUGU_CLANG_TIDY="$llvm_prefix/bin/clang-tidy" \
            -DUGURUGU_RUN_CLANG_TIDY="$llvm_prefix/bin/run-clang-tidy"

      - name: Build analysis inputs
        run: >-
          cmake --build --preset macos-debug
          --target ugurugu_tests --parallel

      - name: Run Clang-Tidy
        run: >-
          cmake --build --preset macos-debug
          --target ugurugu_tidy

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Debug
            os: windows-2025
            preset: windows-debug
            qt-host: windows
            qt-arch: win64_msvc2022_64
          # macOS 15 이미지의 AppleClang 17 ASan runtime은 Qt raster
          # rasterizer가 cell pool 오버플로로 longjmp할 때
          # __asan_handle_no_return의 stack unpoison 경로가 내부 CHECK로
          # 죽는다. 다른 job과 달리 이 job만 최신 sanitizer runtime이
          # 필요하다.
          - name: macOS ASan + UBSan
            os: macos-26
            preset: macos-sanitized
            qt-host: mac
            qt-arch: clang_64
          - name: macOS Coverage
            os: macos-15
            preset: macos-coverage
            qt-host: mac
            qt-arch: clang_64
            coverage: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '${{ env.QT_VERSION }}'
          aqtsource: '${{ env.AQT_SOURCE }}'
          host: '${{ matrix.qt-host }}'
          target: desktop
          arch: '${{ matrix.qt-arch }}'
          modules: qtshadertools
          cache: true

      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DUGURUGU_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Prepare coverage profiles
        if: matrix.coverage
        run: mkdir -p "out/build/${{ matrix.preset }}/profiles"

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel --output-on-failure

      - name: Check source coverage
        if: matrix.coverage
        run: |
          profile="out/build/${{ matrix.preset }}/coverage.profdata"
          xcrun llvm-profdata merge \
            -sparse \
            "out/build/${{ matrix.preset }}"/profiles/*.profraw \
            -o "$profile"
          coverage_report=$(xcrun llvm-cov report \
            "out/build/${{ matrix.preset }}/ugurugu_tests" \
            -instr-profile="$profile" \
            -ignore-filename-regex='(/tests/|/_deps/|/out/)')
          printf '%s\n' "$coverage_report"
          line_coverage=$(printf '%s\n' "$coverage_report" | awk '/^TOTAL/ { value=$10; gsub("%", "", value); print value }')
          awk -v coverage="$line_coverage" 'BEGIN { exit !(coverage + 0 >= 70.0) }'

      - name: Test diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content "out/build/${{ matrix.preset }}/Testing/Temporary/LastTest.log" -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $testExecutable = Get-ChildItem `
            "out/build/${{ matrix.preset }}" `
            -Recurse `
            -Filter ugurugu_tests.exe |
            Select-Object -First 1
          if ($testExecutable) {
            & $testExecutable.FullName 2>&1
            "direct run exit code: $LASTEXITCODE"
          }

  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS package
            os: macos-15
            preset: macos-distribution
            qt-host: mac
            qt-arch: clang_64
            smoke: macos
          - name: Windows package
            os: windows-2025
            preset: windows-distribution
            qt-host: windows
            qt-arch: win64_msvc2022_64
            smoke: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '${{ env.QT_VERSION }}'
          aqtsource: '${{ env.AQT_SOURCE }}'
          host: '${{ matrix.qt-host }}'
          target: desktop
          arch: '${{ matrix.qt-arch }}'
          modules: qtshadertools
          cache: true

      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DUGURUGU_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel --output-on-failure

      - name: Test installed macOS package
        if: matrix.smoke == 'macos'
        run: >-
          cmake --build --preset ${{ matrix.preset }}
          --target ugurugu_package_smoke_test

      - name: Test installed Windows package
        if: matrix.smoke == 'windows'
        shell: pwsh
        run: >-
          cmake --build --preset ${{ matrix.preset }}
          --config Release --target ugurugu_package_smoke_test

      - name: Test diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content "out/build/${{ matrix.preset }}/Testing/Temporary/LastTest.log" -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $testExecutable = Get-ChildItem `
            "out/build/${{ matrix.preset }}" `
            -Recurse `
            -Filter ugurugu_tests.exe |
            Select-Object -First 1
          if ($testExecutable) {
            & $testExecutable.FullName 2>&1
            "direct run exit code: $LASTEXITCODE"
          }

  quality:
    name: Quality gate
    if: always()
    needs: [static, translations, web, wasm, fuzz, tidy, build, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality check
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TRANSLATIONS_RESULT: ${{ needs.translations.result }}
          WEB_RESULT: ${{ needs.web.result }}
          WASM_RESULT: ${{ needs.wasm.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          TIDY_RESULT: ${{ needs.tidy.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          failed=0
          for check in STATIC TRANSLATIONS WEB WASM FUZZ TIDY BUILD PACKAGE; do
            result_variable="${check}_RESULT"
            result="${!result_variable}"
            if [[ "$result" != "success" ]]; then
              echo "$check result: $result"
              failed=1
            fi
          done
          exit "$failed"
