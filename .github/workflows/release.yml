name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: 6.11.1
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
  VELOPACK_VERSION: 1.2.0

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify release metadata and source
        id: source
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(sed -nE 's/project\(Ugurugu VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid project version: $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Manual release builds must run from $DEFAULT_BRANCH or a release tag"
            exit 1
          fi
          for language in ko en ja; do
            notes="release-notes/$version.$language.md"
            if [[ ! -s "$notes" ]] || ! grep -q '[^[:space:]]' "$notes"; then
              echo "Missing or empty release notes: $notes"
              exit 1
            fi
          done
          shopt -s nullglob
          notes=(release-notes/"$version".*.md)
          if [[ ${#notes[@]} -ne 3 ]]; then
            echo "Expected exactly ko, en, and ja release notes for version $version"
            printf 'Found: %s\n' "${notes[@]}"
            exit 1
          fi

          source_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          default_branch_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git rev-parse --verify "$default_branch_ref" >/dev/null; then
            echo "Could not resolve the default branch: $default_branch_ref"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$source_commit" "$default_branch_ref"; then
            echo "Release commit $source_commit is not part of $DEFAULT_BRANCH"
            exit 1
          fi
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Require successful main CI for this commit
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          maximum_attempts=160
          api_failure_attempts=0
          missing_attempts=0
          for ((attempt = 1; attempt <= maximum_attempts; ++attempt)); do
            if ! response=$(gh api \
                --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
                -f branch="$DEFAULT_BRANCH" \
                -f event=push \
                -f head_sha="$SOURCE_COMMIT" \
                -f per_page=100); then
              ((api_failure_attempts += 1))
              if [[ "$api_failure_attempts" -ge 6 ]]; then
                echo "Could not query main CI after $api_failure_attempts attempts"
                exit 1
              fi
              echo "GitHub API request failed ($attempt/$maximum_attempts)"
              sleep 30
              continue
            fi
            api_failure_attempts=0
            run=$(jq -c \
              --arg branch "$DEFAULT_BRANCH" \
              --arg commit "$SOURCE_COMMIT" \
              '.workflow_runs
                | map(select(
                    .path == ".github/workflows/ci.yml"
                    and .event == "push"
                    and .head_branch == $branch
                    and .head_sha == $commit
                  ))
                | sort_by(.created_at)
                | reverse
                | .[0] // empty' \
              <<< "$response")
            if [[ -z "$run" ]]; then
              ((missing_attempts += 1))
              if [[ "$missing_attempts" -ge 6 ]]; then
                echo "No main CI run exists for $SOURCE_COMMIT"
                exit 1
              fi
              echo "Waiting for CI on $SOURCE_COMMIT ($attempt/$maximum_attempts)"
            else
              missing_attempts=0
              status=$(jq -r '.status' <<< "$run")
              conclusion=$(jq -r '.conclusion // ""' <<< "$run")
              run_url=$(jq -r '.html_url' <<< "$run")
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" == "success" ]]; then
                  echo "Using successful main CI run: $run_url"
                  printf 'Main CI: [%s](%s)\n' "$run_url" "$run_url" \
                    >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                echo "Main CI concluded $conclusion: $run_url"
                exit 1
              fi
              echo "Waiting for main CI ($status): $run_url"
            fi
            sleep 30
          done
          echo "Timed out waiting for main CI on $SOURCE_COMMIT"
          exit 1

  macos:
    name: Build macOS release
    needs: verify
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '${{ env.QT_VERSION }}'
          aqtsource: '${{ env.AQT_SOURCE }}'
          host: mac
          target: desktop
          modules: qtshadertools
          cache: true

      - name: Configure
        run: >-
          cmake --preset macos-distribution
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"

      - name: Build
        run: cmake --build --preset macos-distribution --parallel

      - name: Test
        run: ctest --preset macos-distribution

      - name: Install
        run: >-
          cmake --install out/build/macos-distribution
          --prefix "$RUNNER_TEMP/install"

      - name: Verify installed package
        run: |
          application="$RUNNER_TEMP/install/Ugurugu.app"
          smoke_root="$RUNNER_TEMP/package-smoke"
          mkdir -p "$smoke_root/MacOS"
          ln -s "$application/Contents/Frameworks" "$smoke_root/Frameworks"
          cp \
            out/build/macos-distribution/ugurugu_package_smoke \
            "$smoke_root/MacOS/"
          "$smoke_root/MacOS/ugurugu_package_smoke" "$application"
          codesign --verify --deep --strict "$application"

      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "$name is not configured"
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" \
            "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"

      - name: Sign the application with Developer ID
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [[ -z "$MACOS_SIGNING_IDENTITY" ]]; then
            echo "MACOS_SIGNING_IDENTITY is not configured"
            exit 1
          fi
          application="$RUNNER_TEMP/install/Ugurugu.app"
          sparkle="$application/Contents/Frameworks/Sparkle.framework"
          sign() {
            codesign --force --timestamp --options runtime \
              --sign "$MACOS_SIGNING_IDENTITY" "$@"
          }
          # Nested code is signed innermost first. Notarization rejects
          # submissions signed with --deep, and Sparkle ships a helper
          # application plus XPC services that each need their own signature.
          for service in "$sparkle/Versions/B/XPCServices"/*.xpc; do
            [[ -e "$service" ]] || continue
            sign "$service"
          done
          sign "$sparkle/Versions/B/Autoupdate"
          sign "$sparkle/Versions/B/Updater.app"
          sign "$sparkle"
          while IFS= read -r -d '' plugin; do
            sign "$plugin"
          done < <(find \
            "$application/Contents/PlugIns" \
            "$application/Contents/Frameworks" \
            -name '*.dylib' -print0)
          for framework in "$application/Contents/Frameworks"/*.framework; do
            if [[ "$framework" == "$sparkle" ]]; then
              continue
            fi
            sign "$framework"
          done
          sign "$application"
          codesign --verify --deep --strict --verbose=2 "$application"

      - name: Notarize and staple the application
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          for name in \
            MACOS_NOTARY_KEY \
            MACOS_NOTARY_KEY_ID \
            MACOS_NOTARY_ISSUER_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "$name is not configured"
              exit 1
            fi
          done
          key="$RUNNER_TEMP/notary-key.p8"
          (umask 077 && printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$key")
          application="$RUNNER_TEMP/install/Ugurugu.app"
          submission="$RUNNER_TEMP/notarize-application.zip"
          ditto -c -k --sequesterRsrc --keepParent "$application" "$submission"
          xcrun notarytool submit "$submission" \
            --key "$key" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait
          rm -f "$key"
          # Stapled before the DMG and the Sparkle archive are built, so both
          # ship a bundle Gatekeeper accepts without a network round trip.
          xcrun stapler staple "$application"
          xcrun stapler validate "$application"
          spctl --assess --type execute --verbose=4 "$application"

      - name: Package DMG and prepare Sparkle update
        id: package
        run: |
          version=$(sed -nE 's/project\(Ugurugu VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          architecture=$(uname -m)
          release_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${release_tag}" != "v${version}" ]]; then
            echo "Release tag ${release_tag} does not match project version ${version}"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            release_tag="v${version}"
          fi
          for language in ko en ja; do
            if [[ ! -f "release-notes/${version}.${language}.md" ]]; then
              echo "Missing release notes: release-notes/${version}.${language}.md"
              exit 1
            fi
          done
          mkdir -p artifacts "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/sparkle-updates"
          cp -R "$RUNNER_TEMP/install/Ugurugu.app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create \
            -volname Ugurugu \
            -srcfolder "$RUNNER_TEMP/dmg" \
            -format UDZO \
            -ov \
            "artifacts/Ugurugu-macOS-${architecture}.dmg"
          archive="Ugurugu-macOS-${architecture}.zip"
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$RUNNER_TEMP/install/Ugurugu.app" \
            "$RUNNER_TEMP/sparkle-updates/$archive"
          out/build/macos-distribution/ugurugu_render_release_notes \
            "release-notes/${version}.en.md" \
            "$RUNNER_TEMP/sparkle-updates/${archive%.zip}.html"
          out/build/macos-distribution/ugurugu_render_release_notes \
            "release-notes/${version}.ko.md" \
            "$RUNNER_TEMP/sparkle-updates/${archive%.zip}.ko.html"
          out/build/macos-distribution/ugurugu_render_release_notes \
            "release-notes/${version}.ja.md" \
            "$RUNNER_TEMP/sparkle-updates/${archive%.zip}.ja.html"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple the DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          dmg=$(find artifacts \
            -maxdepth 1 \
            -type f \
            -name 'Ugurugu-macOS-*.dmg' \
            -print -quit)
          if [[ -z "$dmg" ]]; then
            echo "Missing macOS DMG"
            exit 1
          fi
          key="$RUNNER_TEMP/notary-key.p8"
          (umask 077 && printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$key")
          # The disk image carries its own signature and ticket, so the very
          # first open is accepted offline too, not just the app inside it.
          codesign --force --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$key" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait
          rm -f "$key"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

      - name: Sign Sparkle update and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "SPARKLE_PRIVATE_KEY is not configured"
            exit 1
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            out/build/macos-distribution/_deps/sparkle-src/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/nyabi-gh/Ugurugu/releases/download/${RELEASE_TAG}/" \
              --release-notes-url-prefix "https://github.com/nyabi-gh/Ugurugu/releases/download/${RELEASE_TAG}/" \
              --link "https://github.com/nyabi-gh/Ugurugu" \
              --embed-release-notes \
              --maximum-versions 1 \
              --maximum-deltas 0 \
              "$RUNNER_TEMP/sparkle-updates"
          cp "$RUNNER_TEMP/sparkle-updates/$ARCHIVE" artifacts/
          cp "$RUNNER_TEMP/sparkle-updates/appcast.xml" artifacts/
          cp "$RUNNER_TEMP/sparkle-updates/${ARCHIVE%.zip}.ko.html" artifacts/
          cp "$RUNNER_TEMP/sparkle-updates/${ARCHIVE%.zip}.ja.html" artifacts/

      - name: Verify final macOS containers
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          verify_application() {
            application="$1"
            smoke_root="$2"
            if [[ ! -d "$application" ]]; then
              echo "Missing application bundle: $application"
              return 1
            fi
            mkdir -p "$smoke_root/MacOS"
            ln -s "$application/Contents/Frameworks" "$smoke_root/Frameworks"
            cp \
              out/build/macos-distribution/ugurugu_package_smoke \
              "$smoke_root/MacOS/"
            "$smoke_root/MacOS/ugurugu_package_smoke" "$application"
            codesign --verify --deep --strict "$application"
            xcrun stapler validate "$application"
            spctl --assess --type execute --verbose=4 "$application"
          }

          dmg=$(find artifacts -maxdepth 1 -type f -name 'Ugurugu-macOS-*.dmg' -print -quit)
          if [[ -z "$dmg" ]]; then
            echo "Missing macOS DMG"
            exit 1
          fi
          hdiutil verify "$dmg"
          mount_root="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$mount_root"
          hdiutil attach \
            "$dmg" \
            -readonly \
            -nobrowse \
            -mountpoint "$mount_root"
          trap 'hdiutil detach "$mount_root"' EXIT
          verify_application \
            "$mount_root/Ugurugu.app" \
            "$RUNNER_TEMP/dmg-package-smoke"
          hdiutil detach "$mount_root"
          trap - EXIT

          archive="artifacts/$ARCHIVE"
          if [[ ! -f "$archive" ]]; then
            echo "Missing macOS ZIP: $archive"
            exit 1
          fi
          zip_root="$RUNNER_TEMP/zip-extracted"
          mkdir -p "$zip_root"
          ditto -x -k "$archive" "$zip_root"
          verify_application \
            "$zip_root/Ugurugu.app" \
            "$RUNNER_TEMP/zip-package-smoke"

      - name: Verify macOS compatibility
        run: |
          application="$RUNNER_TEMP/install/Ugurugu.app"
          cache="out/build/macos-distribution/CMakeCache.txt"
          minimum_target=$(sed -n 's/^CMAKE_OSX_DEPLOYMENT_TARGET:[^=]*=//p' "$cache")
          if [[ ! "$minimum_target" =~ ^[0-9]+([.][0-9]+){0,2}$ ]]; then
            echo "Invalid macOS deployment target: $minimum_target"
            exit 1
          fi
          version_exceeds() {
            awk -v candidate="$1" -v target="$2" '
              BEGIN {
                candidate_count = split(candidate, candidate_parts, ".")
                target_count = split(target, target_parts, ".")
                count = candidate_count > target_count ? candidate_count : target_count
                for (part_index = 1; part_index <= count; ++part_index) {
                  candidate_part = candidate_parts[part_index] + 0
                  target_part = target_parts[part_index] + 0
                  if (candidate_part > target_part) {
                    exit 0
                  }
                  if (candidate_part < target_part) {
                    exit 1
                  }
                }
                exit 1
              }
            '
          }
          failed=0
          declared=$(plutil -extract LSMinimumSystemVersion raw -o - "$application/Contents/Info.plist")
          if [[ "$declared" != "$minimum_target" ]]; then
            echo "Info.plist declares macOS $declared instead of $minimum_target"
            failed=1
          fi
          while IFS= read -r binary; do
            if ! file "$binary" | grep -q "Mach-O"; then
              continue
            fi
            while IFS= read -r minimum; do
              if version_exceeds "$minimum" "$minimum_target"; then
                echo "$binary requires macOS $minimum instead of $minimum_target"
                failed=1
              fi
            done < <(otool -l "$binary" | awk '$1 == "minos" { print $2 }')
            while IFS= read -r dependency; do
              case "$dependency" in
                @rpath/*|@loader_path/*|@executable_path/*|/System/Library/*|/usr/lib/*)
                  ;;
                *)
                  echo "$binary contains external runtime dependency $dependency"
                  failed=1
                  ;;
              esac
            done < <(
              dyld_info -dependents "$binary" | awk '
                /\[[^]]+\]:$/ { linked = 0 }
                $1 == "-linked_dylibs:" { linked = 1; next }
                $1 == "-rpaths:" { linked = 0 }
                linked && $1 != "attributes" { print $NF }
              '
            )
            while IFS= read -r rpath; do
              case "$rpath" in
                @loader_path/*|@executable_path/*)
                  ;;
                *)
                  echo "$binary contains non-portable runtime search path $rpath"
                  failed=1
                  ;;
              esac
            done < <(
              otool -l "$binary" | awk '
                $1 == "cmd" && $2 == "LC_RPATH" { rpath = 1; next }
                rpath && $1 == "path" { print $2; rpath = 0 }
              '
            )
          done < <(find "$application" -type f)
          exit "$failed"

      - name: Create macOS release metadata
        run: |
          version=$(sed -nE 's/project\(Ugurugu VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          architecture=$(uname -m)
          minimum_target=$(sed -n 's/^CMAKE_OSX_DEPLOYMENT_TARGET:[^=]*=//p' out/build/macos-distribution/CMakeCache.txt)
          cmake_version=$(cmake --version | awk 'NR == 1 { print $3 }')
          compiler_path=$(sed -n 's/^CMAKE_CXX_COMPILER:[^=]*=//p' out/build/macos-distribution/CMakeCache.txt)
          if [[ ! -x "$compiler_path" ]]; then
            echo "Could not locate the configured C++ compiler"
            exit 1
          fi
          compiler_version=$("$compiler_path" --version | awk 'NR == 1')
          metadata="artifacts/Ugurugu-macOS-${architecture}-build-metadata.txt"
          {
            printf 'project=Ugurugu\n'
            printf 'version=%s\n' "$version"
            printf 'git_commit=%s\n' "$GITHUB_SHA"
            printf 'architecture=%s\n' "$architecture"
            printf 'qt_version=%s\n' "$QT_VERSION"
            printf 'macos_deployment_target=%s\n' "$minimum_target"
            printf 'cmake_version=%s\n' "$cmake_version"
            printf 'compiler=%s (%s)\n' "$compiler_path" "$compiler_version"
          } > "$metadata"
          (
            cd artifacts
            artifacts_to_hash=(*)
            shasum -a 256 "${artifacts_to_hash[@]}" > SHA256SUMS-macOS.txt
          )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-release
          path: artifacts/*
          if-no-files-found: error

  windows:
    name: Build Windows release
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '${{ env.QT_VERSION }}'
          aqtsource: '${{ env.AQT_SOURCE }}'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true

      - name: Install Velopack
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version $env:VELOPACK_VERSION

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-distribution `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: >-
          cmake --build --preset windows-distribution
          --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --preset windows-distribution

      - name: Install
        shell: pwsh
        run: |
          cmake --install out/build/windows-distribution `
            --config Release `
            --prefix "$env:RUNNER_TEMP\Ugurugu"

      - name: Package with Velopack
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(Ugurugu VERSION ([0-9.]+)') {
            throw "Could not determine application version"
          }
          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match project version $version"
          }
          $releaseNotes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $sections = foreach ($language in @('ko', 'en', 'ja')) {
            $file = "release-notes/$version.$language.md"
            if (-not (Test-Path $file)) {
              throw "Missing release notes: $file"
            }
            "<!-- lang:$language -->"
            Get-Content $file -Raw
          }
          Set-Content -Path $releaseNotes -Value ($sections -join "`n")
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          vpk pack `
            --packId Ugurugu `
            --packVersion $version `
            --packDir "$env:RUNNER_TEMP\Ugurugu" `
            --mainExe Ugurugu.exe `
            --packTitle Ugurugu `
            --packAuthors nyabi-gh `
            --icon resources/icons/Ugurugu.ico `
            --releaseNotes $releaseNotes `
            --runtime win10-x64 `
            --framework vcredist145-x64 `
            --channel win `
            --delta None `
            --noPortable true `
            --outputDir artifacts
          Rename-Item `
            -Path "artifacts\Ugurugu-win-Setup.exe" `
            -NewName "Ugurugu-Windows-x64-Setup.exe"

      - name: Verify final Windows installer
        shell: pwsh
        run: |
          $setup = Resolve-Path "artifacts\Ugurugu-Windows-x64-Setup.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "velopack-smoke"
          $installer = Start-Process `
            -FilePath $setup `
            -ArgumentList @("--silent", "--installto", $installRoot) `
            -PassThru `
            -Wait
          if ($installer.ExitCode -ne 0) {
            throw "Installer exited with code $($installer.ExitCode)"
          }

          $current = Join-Path $installRoot "current"
          $application = Join-Path $current "Ugurugu.exe"
          $update = Join-Path $installRoot "Update.exe"
          $version = Join-Path $current "sq.version"
          foreach ($path in @($current, $application, $update, $version)) {
            if (-not (Test-Path $path)) {
              throw "Installed package is missing $path"
            }
          }
          if ((Get-Item $application).Length -le 0 -or
              (Get-Item $update).Length -le 0 -or
              (Get-Item $version).Length -le 0) {
            throw "Installed package contains an empty executable or version file"
          }

          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process $application -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Installed application exited with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - name: Create Windows release metadata
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(Ugurugu VERSION ([0-9.]+)') {
            throw "Could not determine application version"
          }
          $version = $Matches[1]
          $cmakeVersion = (cmake --version | Select-Object -First 1) `
            -replace '^cmake version ', ''
          $compilerFile = Get-ChildItem `
            out/build/windows-distribution `
            -Recurse `
            -Filter CMakeCXXCompiler.cmake |
            Select-Object -First 1
          if (-not $compilerFile) {
            throw "Could not locate CMake compiler metadata"
          }
          $compilerConfiguration = Get-Content $compilerFile.FullName -Raw
          $compilerId = [regex]::Match(
            $compilerConfiguration,
            'set\(CMAKE_CXX_COMPILER_ID "([^"]+)"\)'
          ).Groups[1].Value
          $compilerVersion = [regex]::Match(
            $compilerConfiguration,
            'set\(CMAKE_CXX_COMPILER_VERSION "([^"]+)"\)'
          ).Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($compilerId) -or
              [string]::IsNullOrWhiteSpace($compilerVersion)) {
            throw "Could not read CMake compiler metadata"
          }
          $metadata = @(
            "project=Ugurugu"
            "version=$version"
            "git_commit=$env:GITHUB_SHA"
            "architecture=x64"
            "qt_version=$env:QT_VERSION"
            "velopack_version=$env:VELOPACK_VERSION"
            "cmake_version=$cmakeVersion"
            "compiler=$compilerId $compilerVersion"
          )
          $metadataPath = Join-Path artifacts "Ugurugu-Windows-x64-build-metadata.txt"
          Set-Content -Path $metadataPath -Value $metadata -Encoding utf8
          $checksums = foreach ($artifact in (Get-ChildItem artifacts -File | Sort-Object Name)) {
            $hash = (Get-FileHash -Algorithm SHA256 $artifact.FullName).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          $checksumPath = Join-Path artifacts "SHA256SUMS-Windows.txt"
          $utf8WithoutBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText(
            $checksumPath,
            ($checksums -join "`n") + "`n",
            $utf8WithoutBom
          )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-release
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [verify, macos, windows]
    if: success() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            cat "release-notes/${version}.ko.md"
            echo
            echo "<details><summary>English</summary>"
            echo
            cat "release-notes/${version}.en.md"
            echo
            echo "</details>"
            echo
            echo "<details><summary>日本語</summary>"
            echo
            cat "release-notes/${version}.ja.md"
            echo
            echo "</details>"
          } > "$RUNNER_TEMP/release-body.md"
          echo "path=$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          name: Ugurugu ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: artifacts/*
