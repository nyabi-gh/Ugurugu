name: Release 3

# The Rust 3.x app for Windows, macOS and Linux. 2.x (C++) is not released
# any more.
on:
  push:
    tags:
      - 'v3.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-3-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The same version as the velopack crate in Cargo.toml.
  VELOPACK_VERSION: 1.2.161
  CARGO_ABOUT_VERSION: 0.9.2

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify release metadata and source
        id: source
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(sed -nE '/^\[workspace\.package\]/,/^\[/ s/^version = "([^"]+)"/\1/p' Cargo.toml)
          if [[ ! "$version" =~ ^3\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid 3.x workspace version: $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Manual release builds must run from $DEFAULT_BRANCH or a release tag"
            exit 1
          fi
          notes="release-notes/$version.en.md"
          if [[ ! -s "$notes" ]] || ! grep -q '[^[:space:]]' "$notes"; then
            echo "Missing or empty release notes: $notes"
            exit 1
          fi

          source_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          default_branch_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$source_commit" "$default_branch_ref"; then
            echo "Release commit $source_commit is not part of $DEFAULT_BRANCH"
            exit 1
          fi
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941
        with:
          tool: cargo-deny@0.18.9

      # CI leaves advisories out of pull requests; a release ships none.
      - name: Check dependency advisories
        run: cargo deny --locked check advisories

      - name: Require successful main CI for this commit
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: bash .github/scripts/wait-for-main-ci.sh

  windows:
    name: Build Windows release
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.x'

      - name: Install Velopack
        shell: pwsh
        run: dotnet tool install --global vpk --version $env:VELOPACK_VERSION

      - name: Check native dependencies
        run: python tools/native_deps.py

      - name: Build
        run: cargo build --package ugurugu --release --locked

      - name: Package with Velopack
        shell: pwsh
        run: >-
          ./tools/package_windows.ps1
          -Executable target/release/ugurugu.exe
          -OutputDirectory artifacts

      - name: Install, run and uninstall
        shell: pwsh
        run: >-
          ./tools/package_smoke.ps1
          -Setup (Get-Item artifacts/*-Setup.exe).FullName
          -WorkDirectory "$env:RUNNER_TEMP/smoke"

      - name: Create Windows release metadata
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?ms)^\[workspace\.package\][^\[]*?^version = "([^"]+)"') {
            throw "Could not read the workspace version"
          }
          $metadata = @(
            "project=Ugurugu"
            "version=$($Matches[1])"
            "git_commit=$env:GITHUB_SHA"
            "architecture=x64"
            "rustc=$(rustc --version)"
            "velopack_version=$env:VELOPACK_VERSION"
          )
          $metadataPath = Join-Path artifacts "Ugurugu-Windows-x64-build-metadata.txt"
          Set-Content -Path $metadataPath -Value $metadata -Encoding utf8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-release
          path: artifacts/*
          if-no-files-found: error

  # Signed with the Developer ID and notarized (docs/rust/decisions.md
  # section 10); a release without the signing secrets stops here.
  macos:
    name: Build macOS release
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.x'

      - name: Install Velopack
        run: dotnet tool install --global vpk --version "$VELOPACK_VERSION"

      - name: Build
        run: cargo build --package ugurugu --release --locked

      # MACOS_CERTIFICATE is the Developer ID Application certificate and key
      # as a base64 .p12; MACOS_NOTARY_KEY is the text of an App Store
      # Connect API key (.p8).
      - name: Import the Developer ID and the notary key
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "Missing secret $name"
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # Lets codesign use the key without a prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s\n' "$MACOS_NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials ugurugu-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER" --keychain "$keychain"
          rm "$RUNNER_TEMP/notary.p8"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Package with Velopack, sign and notarize
        run: |
          python3 tools/package_unix.py macos target/release/ugurugu artifacts \
            --sign-identity "Developer ID Application" --notary-profile ugurugu-notary \
            --keychain "${{ steps.signing.outputs.keychain }}"

      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}"

      - name: Unpack and run
        run: python3 tools/package_smoke_unix.py macos artifacts/*-macOS-arm64.dmg "$RUNNER_TEMP/smoke" --notarized

      - name: Create macOS release metadata
        run: bash .github/scripts/release-metadata.sh macOS-arm64 arm64 artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-release
          path: artifacts/*
          if-no-files-found: error

  # Built on the oldest Ubuntu the AppImage supports, so its glibc (2.35)
  # is the lowest one it needs (docs/rust/decisions.md section 10).
  linux:
    name: Build Linux release
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install build, packaging and test packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev squashfs-tools xvfb mesa-vulkan-drivers \
            libxcursor1 libxi6 libxkbcommon-x11-0 libxrandr2

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.x'

      - name: Install Velopack
        run: dotnet tool install --global vpk --version "$VELOPACK_VERSION"

      - name: Build
        run: cargo build --package ugurugu --release --locked

      - name: Package with Velopack
        run: python3 tools/package_unix.py linux target/release/ugurugu artifacts

      - name: Unpack and run
        run: xvfb-run -a python3 tools/package_smoke_unix.py linux artifacts/*-Linux-x64.AppImage "$RUNNER_TEMP/smoke"

      - name: Create Linux release metadata
        run: bash .github/scripts/release-metadata.sh Linux-x64 x64 artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-release
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [verify, windows, macos, linux]
    if: success() && startsWith(github.ref, 'refs/tags/')
    # One at a time across tags: they share the `updates` release.
    concurrency:
      group: release-3-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artifacts
          merge-multiple: true

      - name: Locate release notes
        id: notes
        run: echo "path=release-notes/${GITHUB_REF_NAME#v}.en.md" >> "$GITHUB_OUTPUT"

      # The app updates from the `updates` release (apps/ugurugu/src/update.rs),
      # so a version's own release holds only its installers. Each OS has a
      # channel, with a package and a list of its own there. A package is
      # never replaced or removed there: GitHub would forget its download
      # count, which the download badge sums.
      - name: Publish the update packages
        # With pipefail, so a list that cannot be read stops the step.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          if ! gh release view updates >/dev/null 2>&1; then
            gh release create updates --prerelease --target "$GITHUB_SHA" \
              --title "Ugurugu updates" \
              --notes "Update packages that installed Ugurugu 3 downloads by itself. To install Ugurugu, use the Setup file of the latest release."
          fi
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/updates" \
            --jq '.assets[] | select(.state == "uploaded") | "\(.name) \(.digest)"')
          packages=(artifacts/*-full.nupkg)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No update package was built"
            exit 1
          fi
          # A rerun finds its own package there already and goes on.
          new=()
          for package in "${packages[@]}"; do
            name=$(basename "$package")
            digest="sha256:$(sha256sum "$package" | cut -d' ' -f1)"
            there=$(awk -v name="$name" '$1 == name { print $2 }' <<< "$published")
            if [[ -z "$there" ]]; then
              new+=("$package")
            elif [[ "$there" != "$digest" ]]; then
              echo "$name is published already with other content; a new one would reset its download count"
              exit 1
            fi
          done
          if [[ ${#new[@]} -gt 0 ]]; then
            gh release upload updates "${new[@]}" --clobber
          fi
          # Each build's lists name its own version alone, so an older tag
          # run again would offer that version as the latest.
          version="${GITHUB_REF_NAME#v}"
          if grep -q '^releases\..*\.json ' <<< "$published"; then
            lists_there="$RUNNER_TEMP/published-lists"
            gh release download updates --pattern 'releases.*.json' --dir "$lists_there"
            listed=$(jq -r '.Assets[].Version' "$lists_there"/releases.*.json | sort -V | tail -n 1)
            if [[ -z "$listed" ]]; then
              echo "The published update list names no version"
              exit 1
            fi
            if [[ "$(printf '%s\n' "$listed" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
              echo "The update lists name $listed, newer than $version, and are kept"
              exit 0
            fi
          fi
          # The list last, so it never names a package not there yet.
          lists=()
          for file in artifacts/*; do
            case "$(basename "$file")" in
              *-full.nupkg | *Setup.exe | *-macOS-arm64.dmg | *.AppImage | releases.*.json) ;;
              *) lists+=("$file") ;;
            esac
          done
          gh release upload updates "${lists[@]}" --clobber
          gh release upload updates artifacts/releases.*.json --clobber

      # The written notes, then GitHub's list of the pull requests merged
      # since the previous release and the full changelog link.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          name: Ugurugu ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: |
            artifacts/*-Setup.exe
            artifacts/*-macOS-arm64.dmg
            artifacts/*-Linux-x64.AppImage

      # A release made with this job's token starts no workflow, so its
      # `release` event never reaches the badge.
      - name: Count the release on the download badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run download-badge.yml --repo "$GITHUB_REPOSITORY" --ref main
