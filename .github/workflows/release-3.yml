name: Release 3

# The Rust 3.x Windows app. 2.x (C++) is not released any more; macOS gets a
# new release workflow when 3.x supports it.
on:
  push:
    tags:
      - 'v3.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-3-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The same version as the velopack crate in Cargo.toml.
  VELOPACK_VERSION: 1.2.161
  CARGO_ABOUT_VERSION: 0.9.2

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify release metadata and source
        id: source
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(sed -nE '/^\[workspace\.package\]/,/^\[/ s/^version = "([^"]+)"/\1/p' Cargo.toml)
          if [[ ! "$version" =~ ^3\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid 3.x workspace version: $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Manual release builds must run from $DEFAULT_BRANCH or a release tag"
            exit 1
          fi
          notes="release-notes/$version.en.md"
          if [[ ! -s "$notes" ]] || ! grep -q '[^[:space:]]' "$notes"; then
            echo "Missing or empty release notes: $notes"
            exit 1
          fi

          source_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          default_branch_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$source_commit" "$default_branch_ref"; then
            echo "Release commit $source_commit is not part of $DEFAULT_BRANCH"
            exit 1
          fi
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Require successful main CI for this commit
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: bash .github/scripts/wait-for-main-ci.sh

  windows:
    name: Build Windows release
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Install Velopack
        shell: pwsh
        run: dotnet tool install --global vpk --version $env:VELOPACK_VERSION

      - name: Check native dependencies
        run: python tools/native_deps.py

      - name: Build
        run: cargo build --package ugurugu --release --locked

      - name: Package with Velopack
        shell: pwsh
        run: >-
          ./tools/package_windows.ps1
          -Executable target/release/ugurugu.exe
          -OutputDirectory artifacts

      - name: Install, run and uninstall
        shell: pwsh
        run: >-
          ./tools/package_smoke.ps1
          -Setup (Get-Item artifacts/*-Setup.exe).FullName
          -WorkDirectory "$env:RUNNER_TEMP/smoke"

      - name: Create Windows release metadata
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?ms)^\[workspace\.package\][^\[]*?^version = "([^"]+)"') {
            throw "Could not read the workspace version"
          }
          $metadata = @(
            "project=Ugurugu"
            "version=$($Matches[1])"
            "git_commit=$env:GITHUB_SHA"
            "architecture=x64"
            "rustc=$(rustc --version)"
            "velopack_version=$env:VELOPACK_VERSION"
          )
          $metadataPath = Join-Path artifacts "Ugurugu-Windows-x64-build-metadata.txt"
          Set-Content -Path $metadataPath -Value $metadata -Encoding utf8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-release
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [verify, windows]
    if: success() && startsWith(github.ref, 'refs/tags/')
    # One at a time across tags: they share the `updates` release.
    concurrency:
      group: release-3-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artifacts
          merge-multiple: true

      - name: Locate release notes
        id: notes
        run: echo "path=release-notes/${GITHUB_REF_NAME#v}.en.md" >> "$GITHUB_OUTPUT"

      # The app updates from the `updates` release (apps/ugurugu/src/update.rs),
      # so a version's own release holds only its installer. A package is
      # never replaced or removed there: GitHub would forget its download
      # count, which the download badge sums.
      - name: Publish the update packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          if ! gh release view updates >/dev/null 2>&1; then
            gh release create updates --prerelease --target "$GITHUB_SHA" \
              --title "Ugurugu updates" \
              --notes "Update packages that installed Ugurugu 3 downloads by itself. To install Ugurugu, use the Setup file of the latest release."
          fi
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/updates" \
            --jq '.assets[] | select(.state == "uploaded") | "\(.name) \(.digest)"')
          packages=(artifacts/*-full.nupkg)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No update package was built"
            exit 1
          fi
          # A rerun finds its own package there already and goes on.
          new=()
          for package in "${packages[@]}"; do
            name=$(basename "$package")
            digest="sha256:$(sha256sum "$package" | cut -d' ' -f1)"
            there=$(awk -v name="$name" '$1 == name { print $2 }' <<< "$published")
            if [[ -z "$there" ]]; then
              new+=("$package")
            elif [[ "$there" != "$digest" ]]; then
              echo "$name is published already with other content; a new one would reset its download count"
              exit 1
            fi
          done
          if [[ ${#new[@]} -gt 0 ]]; then
            gh release upload updates "${new[@]}" --clobber
          fi
          # Each build's lists name its own version alone, so an older tag
          # run again would offer that version as the latest.
          version="${GITHUB_REF_NAME#v}"
          if grep -q '^releases\..*\.json ' <<< "$published"; then
            listed=$(gh release download updates --pattern 'releases.*.json' --output - \
              | jq -r '.Assets[].Version' | sort -V | tail -n 1)
            if [[ "$(printf '%s\n' "$listed" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
              echo "The update lists name $listed, newer than $version, and are kept"
              exit 0
            fi
          fi
          # The list last, so it never names a package not there yet.
          lists=()
          for file in artifacts/*; do
            case "$(basename "$file")" in
              *-full.nupkg | *Setup.exe | releases.*.json) ;;
              *) lists+=("$file") ;;
            esac
          done
          gh release upload updates "${lists[@]}" --clobber
          gh release upload updates artifacts/releases.*.json --clobber

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          name: Ugurugu ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: artifacts/*-Setup.exe

      # A release made with this job's token starts no workflow, so its
      # `release` event never reaches the badge.
      - name: Count the release on the download badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run download-badge.yml --repo "$GITHUB_REPOSITORY" --ref main
