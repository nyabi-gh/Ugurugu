name: Release 3

# The Rust 3.x Windows app. 2.x (C++) is not released any more; macOS gets a
# new release workflow when 3.x supports it.
on:
  push:
    tags:
      - 'v3.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-3-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The same version as the velopack crate in Cargo.toml.
  VELOPACK_VERSION: 1.2.161
  CARGO_ABOUT_VERSION: 0.9.2

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify release metadata and source
        id: source
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(sed -nE '/^\[workspace\.package\]/,/^\[/ s/^version = "([^"]+)"/\1/p' Cargo.toml)
          if [[ ! "$version" =~ ^3\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid 3.x workspace version: $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Manual release builds must run from $DEFAULT_BRANCH or a release tag"
            exit 1
          fi
          notes="release-notes/$version.en.md"
          if [[ ! -s "$notes" ]] || ! grep -q '[^[:space:]]' "$notes"; then
            echo "Missing or empty release notes: $notes"
            exit 1
          fi

          source_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          default_branch_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$source_commit" "$default_branch_ref"; then
            echo "Release commit $source_commit is not part of $DEFAULT_BRANCH"
            exit 1
          fi
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Require successful main CI for this commit
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: bash .github/scripts/wait-for-main-ci.sh

  windows:
    name: Build Windows release
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Install Velopack
        shell: pwsh
        run: dotnet tool install --global vpk --version $env:VELOPACK_VERSION

      - name: Check native dependencies
        run: python tools/native_deps.py

      - name: Build
        run: cargo build --package ugurugu --release --locked

      - name: Package with Velopack
        shell: pwsh
        run: >-
          ./tools/package_windows.ps1
          -Executable target/release/ugurugu.exe
          -OutputDirectory artifacts

      - name: Install, run and uninstall
        shell: pwsh
        run: >-
          ./tools/package_smoke.ps1
          -Setup artifacts/Ugurugu-Windows-x64-Setup.exe
          -WorkDirectory "$env:RUNNER_TEMP/smoke"

      - name: Create Windows release metadata
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?ms)^\[workspace\.package\][^\[]*?^version = "([^"]+)"') {
            throw "Could not read the workspace version"
          }
          $metadata = @(
            "project=Ugurugu"
            "version=$($Matches[1])"
            "git_commit=$env:GITHUB_SHA"
            "architecture=x64"
            "rustc=$(rustc --version)"
            "velopack_version=$env:VELOPACK_VERSION"
          )
          $metadataPath = Join-Path artifacts "Ugurugu-Windows-x64-build-metadata.txt"
          Set-Content -Path $metadataPath -Value $metadata -Encoding utf8
          $checksums = foreach ($artifact in (Get-ChildItem artifacts -File | Sort-Object Name)) {
            $hash = (Get-FileHash -Algorithm SHA256 $artifact.FullName).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          $checksumPath = Join-Path artifacts "SHA256SUMS-Windows.txt"
          $utf8WithoutBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText(
            $checksumPath,
            ($checksums -join "`n") + "`n",
            $utf8WithoutBom
          )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-release
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [verify, windows]
    if: success() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          merge-multiple: true

      - name: Locate release notes
        id: notes
        run: echo "path=release-notes/${GITHUB_REF_NAME#v}.en.md" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          name: Ugurugu ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: artifacts/*
