name: Download badge

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/update-download-badge.js
      - .github/workflows/download-badge.yml
  release:
    types:
      - published
  schedule:
    # Hourly, as scheduled runs are sometimes dropped.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Update filtered download count
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 3
          script: |
            const updateDownloadBadge = require(
              './.github/scripts/update-download-badge.js')
            await updateDownloadBadge({ github, context, core })
