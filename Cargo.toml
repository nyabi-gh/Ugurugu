[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "tools/latency-probe", "tools/render-bench", "tools/ugu-doc"]

[workspace.package]
version = "3.0.0-dev"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# The same version egui-winit uses for text.
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
egui = "=0.36.2"
egui-winit = { version = "=0.36.2", default-features = false, features = ["accesskit", "clipboard"] }
egui-wgpu = { version = "=0.36.2", default-features = false, features = ["winit"] }
fluent-bundle = "=0.16.0"
# Still images to import; the codecs 3.0 reads and nothing else.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
png = "=0.18.1"
pollster = "=1.0.1"
proptest = "=1.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
unic-langid = "=0.9.6"
ugu-core = { path = "crates/ugu-core" }
ugu-io = { path = "crates/ugu-io" }
ugu-render = { path = "crates/ugu-render" }
ugu-session = { path = "crates/ugu-session" }
ugu-win = { path = "crates/ugu-win" }
vello_cpu = { version = "=0.3.0", default-features = false, features = ["std", "u8_pipeline", "multithreading"] }
# DX12 only: with Vulkan compiled in, wgpu would prefer a Vulkan adapter.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
# Same version as wgpu-hal so that its DXGI interfaces can be used directly.
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_System_Com", "Win32_System_Performance", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Deflate through pure-Rust zlib-rs only: the default features add C codecs.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"
