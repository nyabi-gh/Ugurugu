[workspace]
resolver = "3"
members = ["apps/*"]

[workspace.package]
version = "3.0.0-dev"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
egui = "=0.36.2"
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard"] }
egui-wgpu = { version = "=0.36.2", default-features = false, features = ["winit"] }
pollster = "=1.0.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
# DX12 only: with Vulkan compiled in, wgpu would prefer a Vulkan adapter.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"
