[package]
name = "ugu-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ugu-platform-types.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["block2", "objc2-uniform-type-identifiers", "NSApplication", "NSButton", "NSControl", "NSMenu", "NSOpenPanel", "NSPanel", "NSPopUpButton", "NSResponder", "NSSavePanel", "NSView", "NSWindow"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSFileManager", "NSGeometry", "NSObject", "NSPathUtilities", "NSString", "NSURL"] }
objc2-uniform-type-identifiers.workspace = true

[target.'cfg(windows)'.dependencies]
ugu-win.workspace = true

[lints]
workspace = true
