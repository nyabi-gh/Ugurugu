[package]
name = "ugu-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ugu-platform-types.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
arboard.workspace = true
futures-lite.workspace = true
percent-encoding.workspace = true
png.workspace = true
sha2.workspace = true
tracing.workspace = true
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
x11rb.workspace = true
zbus.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
arboard.workspace = true
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["block2", "objc2-uniform-type-identifiers", "NSApplication", "NSButton", "NSCell", "NSControl", "NSEvent", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSPopUpButton", "NSResponder", "NSSavePanel", "NSView", "NSWindow"] }
objc2-foundation = { workspace = true, features = ["NSAppleEventDescriptor", "NSAppleEventManager", "NSArray", "NSData", "NSDate", "NSDateFormatter", "NSFileManager", "NSFormatter", "NSGeometry", "NSLocale", "NSObject", "NSPathUtilities", "NSString", "NSURL"] }
